<!DOCTYPE html>
<html lang="ru">
<head>

  <title>{% if page.title %}{{ page.title }} — {% endif %}ISOH.RU</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | truncate: 180 }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="{{ '/' | relative_url }}" class="brand">
        <span class="brand-code">ISOH.RU</span>
        <span class="brand-name">Институт социальной организации и гибридного управления</span>

        <a href="{{ '/#contours' | relative_url }}">01. Три контура</a>
        <a href="{{ '/#simulator' | relative_url }}">02. Симулятор</a>

    </div>

    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 ISOH.RU // WORKING OBSERVATORY — Открытая научная тетрадь. Все препринты доступны для цитирования.</p>
    </div>

</html>
