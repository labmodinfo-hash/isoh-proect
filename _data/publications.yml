    abstract: "Рассматривается методологическое противостояние примордиализма и конструктивизма в этнологии и социальной антропологии через призму аналитической психологии К. Г. Юнга. Этничность в юнгианской парадигме понимается как символическая система, укоренённая в коллективном бессознательном, но актуализируемая через культурное сознание и социальный контекст. Предложена концепция «психической реальности этноса» как третьего пути."
