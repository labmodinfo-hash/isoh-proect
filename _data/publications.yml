    abstract: "Рассматриваются причины и последствия развития цифровых технологий в медиакоммуникации. На основе социологии П. Бурдье и И. Гофмана анализируются философские основания расширения современной медиакультуры и изменения повседневной жизни, отдельно разобраны роль искусственного интеллекта в медиакоммуникации и его место в образовательных программах. Делается вывод, что ИИ следует понимать как ещё один инструмент, а не замену рекламе и журналистике."
