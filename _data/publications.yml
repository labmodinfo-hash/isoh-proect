    doi: ""
    abstract: "Рассматривается трансформация образа города в японской анимации. На материале аниме «Евангелион», «Паразит» и «Эксперименты Лейн» анализируется городская среда как активный субъект взаимодействия: защитный механизм (Токио-3), поле биологического вторжения и цифровая сеть, стирающая границы между физической и виртуальной реальностью. Показано, какие архитектурные и пространственные метафоры используются в аниме для визуализации коллективных тревог."
