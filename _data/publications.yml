    abstract: "Выявляются и систематизируются семиотические коды, формирующие визуальный регистр современной японской анимации. На материале четырёх культовых сериалов («Евангелион», «Эксперименты Лейн», «Монстр», «Атака титанов») разработана авторская схема из шести групп кодов. Визуальный регистр аниме рассматривается как открытая, самоописывающая семиотическая система."
    pdf: "/assets/pdf/rubtsova-2026-semiotic-codes.pdf"
    cite: "Рубцова М.В. Семиотические коды и визуальный регистр современной экранной анимации: сравнительный мультимодальный анализ // Международный научно-исследовательский журнал. 2026. № 10 (172). DOI: 10.60797/IRJ.2026.172.5."
