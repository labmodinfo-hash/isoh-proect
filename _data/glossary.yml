glossary:
  - title: "Гибридная управляемость"
    original: "Hybrid Governance"
    category: "Базовые категории"
    description: "Режим координации социальных и организационных систем, при котором ни один из классических механизмов власти (иерархический приказ, рыночная цена или программный код) не обладает монополией. Реальная траектория системы возникает на пересечении формальных норм, алгоритмической архитектуры и неформальных сетевых договорённостей."

  - title: "Институциональный клинч"
    original: "Institutional Deadlock"
    category: "Базовые категории"
    description: "Состояние взаимной блокировки контуров управления, возникающее при попытке жёстко оцифровать противоречивые бюрократические регламенты без пересмотра их внутренней логики. Приводит либо к остановке процессов, либо к полному вытеснению реальной деятельности в теневой контур."

  - title: "Аутопоэзис организации"
    original: "Autopoiesis (N. Luhmann)"
    category: "Контур I · Формальная бюрократия"
    description: "Свойство сложных социальных систем воспроизводить собственные элементы и границы изнутри себя. Внешние реформы воспринимаются бюрократической системой не как прямые команды, а как раздражения среды, которые переводятся на язык привычных регламентов и отчётности."

  - title: "Ритуализация процедур"
    original: "Procedural Ritualism (R. Merton)"
    category: "Контур I · Формальная бюрократия"
    description: "Смещение фокуса организации с достижения содержательного результата на безупречное соблюдение формальных правил, чек-листов и отчётных форм. Превращает управленческую реформу в последовательность непротиворечивых бумажных или цифровых транзакций."

  - title: "Институциональный изоморфизм"
    original: "Institutional Isomorphism (DiMaggio & Powell)"
    category: "Контур I · Формальная бюрократия"
    description: "Процесс уподобления организаций друг другу под давлением регуляторов, профессиональных стандартов и неопределённости среды. Заставляет институты заимствовать внешние атрибуты современных практик (например, Agile-комитеты или KPI-дашборды) без изменения реального способа принятия решений."

  - title: "Алгоритмический паноптикум"
    original: "Algorithmic Panopticon"
    category: "Контур II · Алгоритмический контроль"
    description: "Конфигурация цифровой власти, при которой управление поведением осуществляется не через прямое наблюдение или приказ, а через архитектуру интерфейса, настройку видимых опций, рейтинги и скрытые метрики ранжирования."

  - title: "Архитектура выбора"
    original: "Choice Architecture (Thaler & Sunstein)"
    category: "Контур II · Алгоритмический контроль"
    description: "Проектирование цифровой или организационной среды (порядок карточек в ленте, настройки по умолчанию, структура полей ввода), которое незаметно направляет решения пользователей и сотрудников в заданное русло без формального запрета альтернатив."

  - title: "Гейминг KPI (Эффект Гудхарта)"
    original: "Metric Gaming / Goodhart's Law"
    category: "Контур II · Алгоритмический контроль"
    description: "Рациональное приспособление участников системы к цифровому контролю, при котором сотрудники или пользователи оптимизируют не содержательную деятельность, а её измеряемый след в отчётах и дашбордах."

  - title: "Цифровой тейлоризм"
    original: "Digital Taylorism"
    category: "Контур II · Алгоритмический контроль"
    description: "Режим сверхконтроля, сочетающий жёсткую регламентацию труда (Контур I) с непрерывным алгоритмическим трекингом каждого действия исполнителя (Контур II). Резко снижает транзакционные издержки надзора, но лишает систему адаптивности и низовой инициативы."

  - title: "Структурное лицемерие"
    original: "Organizational Hypocrisy (N. Brunsson)"
    category: "Контур III · Неформальные практики"
    description: "Системный разрыв между декларативными заявлениями, формальными решениями и реальными действиями организации. Позволяет институту одновременно сохранять внешнюю легитимность и обеспечивать операционную работоспособность за счёт негласных практик."

  - title: "Институциональный брокер"
    original: "Institutional Broker"
    category: "Контур III · Неформальные практики"
    description: "Актор внутри организации (обычно руководитель среднего звена или опытный специалист), обладающий высоким социальным капиталом на стыке контуров. Умеет проводить нестандартные решения через бюрократические барьеры и обходить ограничения цифровых систем за счёт личных договорённостей."

  - title: "Зоны неопределённости"
    original: "Zones of Uncertainty (M. Crozier)"
    category: "Контур III · Неформальные практики"
    description: "Участки организационного процесса, не покрытые жёстким регламентом или алгоритмом. Согласно социологии организаций М. Крозье, реальная скрытая власть концентрируется в руках тех участников, которые контролируют эти неформализуемые узлы."
